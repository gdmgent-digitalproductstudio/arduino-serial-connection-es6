<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Arduino Serial Connection demo">
    <title>Arduino Serial Connection</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="/css/styles.css">
  </head>
  <body>
    <main class="container">
      <!-- Kop en drie live panelen vormen de browserinterface. -->
      <header>
        <small>DPS1 / SERIAL.EXE</small>
        <h1>Arduino Serial Connection</h1>
        <p>Lees een analoge sensor en bedien de led op pin 2.</p>
      </header>

      <!-- De ids zijn de DOM-koppelingen die client/js/main.js bijwerkt. -->
      <article aria-labelledby="status-heading">
        <h2 id="status-heading">Verbinding</h2>
        <dl>
          <div><dt>Status</dt><dd id="connection">Controleren…</dd></div>
          <div><dt>Modus</dt><dd id="mode">—</dd></div>
          <div><dt>Poort</dt><dd id="port">—</dd></div>
        </dl>
      </article>

      <article aria-labelledby="sensor-heading">
        <h2 id="sensor-heading">Sensor A0</h2>
        <p class="reading"><output id="sensor-value">—</output> / 1023</p>
        <progress id="sensor-meter" max="1023" value="0">0</progress>
        <small id="sensor-timestamp">Nog geen meting ontvangen</small>
      </article>

      <article aria-labelledby="led-heading">
        <h2 id="led-heading">Led op pin 2</h2>
        <p>Huidige toestand: <strong id="led-state">uit</strong></p>
        <div role="group">
          <button type="button" data-led-state="on">Led aan</button>
          <button type="button" class="secondary" data-led-state="off">Led uit</button>
        </div>
        <p id="feedback" role="status" aria-live="polite"></p>
      </article>

      <!-- De module-entrypoint haalt data op en koppelt de LED-knoppen. -->
      <footer><small>Express + SerialPort + ES6 modules</small></footer>
    </main>

    <script type="module" src="/js/main.js"></script>
  </body>
</html>
